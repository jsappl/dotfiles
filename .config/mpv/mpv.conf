# use yt-dlp instead of youtube-dl
script-opts=ytdl_hook-ytdl_path=/home/johannes/.bin/yt-dlp

fullscreen=yes

# Intel UHD 620 — VAAPI for hardware decoding (low CPU/fan)
hwdec=vaapi
# extend HW decode to all supported codecs (h264, h265, VP9 — not AV1 on Kaby Lake-R)
hwdec-codecs=all

# GPU rendering via Wayland
vo=gpu
gpu-context=wayland

# resume playback from last position on reopen
save-position-on-quit=yes
